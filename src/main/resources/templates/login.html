<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід у систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container" style="max-width: 420px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="mb-3 text-center">Вхід у TicketService</h4>

            <div th:if="${param.error}" class="alert alert-danger">Невірний email або пароль</div>
            <div th:if="${param.logout}" class="alert alert-info">Ви вийшли з акаунту</div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Увійти</button>
            </form>

            <div class="mt-3 text-center">
                <a th:href="@{/register}">Немає акаунту? Зареєструватися</a><br>
                <a th:href="@{/events}" class="text-muted small">На головну</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
