<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Створити подію</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/events}">TicketService</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/events}">Події</a>
            <a class="nav-link active" th:href="@{/events/new}">+ Створити подію</a>
            <a class="nav-link" th:href="@{/customers}">Покупці</a>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h4 class="mb-0">Створення нової події</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/events/create}" th:object="${eventDto}" method="post">
                <div class="row mb-3">
                    <div class="col-md-8">
                        <label class="form-label">Назва події</label>
                        <input type="text" th:field="*{name}" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Дата проведення</label>
                        <input type="date" th:field="*{eventDate}" class="form-control" required>
                    </div>
                </div>

                <h5 class="mt-4">Місце проведення</h5>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Назва місця (якщо існує — підтягнеться з БД)</label>
                        <input type="text" th:field="*{place.name}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Адреса (для нового місця)</label>
                        <input type="text" th:field="*{place.address}" class="form-control">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4 mb-2">
                    <h5 class="mb-0">Пачки квитків (TicketPackDTO)</h5>
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addPackRow()">
                        + Додати ще пачку
                    </button>
                </div>

                <div id="packs-container">
                    <div class="row g-2 mb-2" th:each="pack, stat : *{ticketPacks}">
                        <div class="col-md-6">
                            <input type="number" step="0.01" min="0"
                                   th:field="*{ticketPacks[__${stat.index}__].cost}"
                                   class="form-control" placeholder="Ціна квитка (грн)">
                        </div>
                        <div class="col-md-6">
                            <input type="number" min="1"
                                   th:field="*{ticketPacks[__${stat.index}__].count}"
                                   class="form-control" placeholder="Кількість квитків">
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-success">Створити подію та згенерувати квитки</button>
                    <a th:href="@{/events}" class="btn btn-secondary">Скасувати</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function addPackRow() {
        const container = document.getElementById('packs-container');
        const index = container.children.length;
        const row = document.createElement('div');
        row.className = 'row g-2 mb-2';
        row.innerHTML = `
            <div class="col-md-6">
                <input type="number" step="0.01" min="0" name="ticketPacks[${index}].cost" class="form-control" placeholder="Ціна квитка (грн)">
            </div>
            <div class="col-md-6">
                <input type="number" min="1" name="ticketPacks[${index}].count" class="form-control" placeholder="Кількість квитків">
            </div>
        `;
        container.appendChild(row);
    }
</script>

</body>
</html>
