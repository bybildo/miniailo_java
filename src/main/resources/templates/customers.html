<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Покупці</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/events}">TicketService</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/events}">Події</a>
            <a class="nav-link" th:href="@{/events/new}">+ Створити подію</a>
            <a class="nav-link active" th:href="@{/customers}">Покупці</a>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <!-- Форма створення нового покупця (пункт 4.b) -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">Реєстрація нового покупця</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/customers/create}" th:object="${newCustomer}" method="post" class="row g-3">
                <div class="col-md-4">
                    <input type="text" th:field="*{name}" class="form-control" placeholder="Ім'я та прізвище" required>
                </div>
                <div class="col-md-4">
                    <input type="email" th:field="*{email}" class="form-control" placeholder="Email" required>
                </div>
                <div class="col-md-3">
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="Телефон (+380...)" required>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-success w-100">Додати</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Список покупців та їхні квитки -->
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">Зареєстровані покупці та їхні квитки</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Ім'я</th>
                    <th>Email</th>
                    <th>Телефон</th>
                    <th>Куплені квитки</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(customers)}">
                    <td colspan="5" class="text-center py-4 text-muted">Покупців ще немає.</td>
                </tr>
                <tr th:each="customer : ${customers}">
                    <td th:text="${customer.id}">1</td>
                    <td class="fw-bold" th:text="${customer.name}">Іван</td>
                    <td th:text="${customer.email}">ivan@example.com</td>
                    <td th:text="${customer.phone}">+380991234567</td>
                    <td>
                        <span th:if="${#lists.isEmpty(customer.tickets)}" class="text-muted">Немає квитків</span>
                        <span th:each="t : ${customer.tickets}" class="badge bg-primary me-1"
                              th:text="${t.event.name} + ' (Місце №' + ${t.number} + ', ' + ${t.cost} + ' грн)'">
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
