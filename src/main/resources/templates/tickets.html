<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вільні квитки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/events}">TicketService</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/events}">Події</a>
            <a class="nav-link" th:href="@{/events/new}">+ Створити подію</a>
            <a class="nav-link" th:href="@{/customers}">Покупці</a>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 th:text="${pageTitle}">Вільні квитки</h3>
        <a th:href="@{/events}" class="btn btn-outline-secondary btn-sm">Назад до подій</a>
    </div>

    <div th:if="${#lists.isEmpty(customers)}" class="alert alert-warning">
        У системі ще немає жодного покупця. <a th:href="@{/customers}">Створіть покупця</a>, щоб оформити квиток.
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Подія</th>
                    <th>Дата</th>
                    <th>Місце №</th>
                    <th>Ціна (грн)</th>
                    <th>Статус</th>
                    <th>Оформити на покупця</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(tickets)}">
                    <td colspan="6" class="text-center py-4 text-muted">Вільних квитків не знайдено.</td>
                </tr>
                <tr th:each="ticket : ${tickets}">
                    <td th:text="${ticket.event.name}">Назва події</td>
                    <td th:text="${ticket.event.eventDate}">2026-12-01</td>
                    <td class="fw-bold" th:text="'№ ' + ${ticket.number}">№ 1</td>
                    <td th:text="${ticket.cost} + ' грн'">500 грн</td>
                    <td><span class="badge bg-success" th:text="${ticket.status}">FREE</span></td>
                    <td>
                        <form th:action="@{/tickets/buy}" method="post" class="d-flex gap-2">
                            <input type="hidden" name="ticketId" th:value="${ticket.id}">
                            <input type="hidden" name="redirectUrl"
                                   th:value="${eventId != null} ? '/tickets/event/' + ${eventId} : '/tickets/search?eventName=' + ${searchQuery}">
                            <select name="customerId" class="form-select form-select-sm" required>
                                <option value="" disabled selected>Оберіть покупця...</option>
                                <option th:each="c : ${customers}"
                                        th:value="${c.id}"
                                        th:text="${c.name} + ' (' + ${c.email} + ')'"></option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-primary"
                                    th:disabled="${#lists.isEmpty(customers)}">Купити</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
