<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вільні квитки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 th:text="${pageTitle}">Вільні квитки</h3>
        <a th:href="@{/events}" class="btn btn-outline-secondary btn-sm">Назад до подій</a>
    </div>

    <div sec:authorize="isAnonymous()" class="alert alert-info">
        Щоб придбати квиток, будь ласка, <a th:href="@{/login}">увійдіть у систему</a> або <a th:href="@{/register}">зареєструйтеся</a>.
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Подія</th>
                    <th>Дата</th>
                    <th>Місце №</th>
                    <th>Ціна (грн)</th>
                    <th>Статус</th>
                    <th>Дія</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(tickets)}">
                    <td colspan="6" class="text-center py-4 text-muted">Вільних квитків не знайдено.</td>
                </tr>
                <tr th:each="ticket : ${tickets}">
                    <td th:text="${ticket.event.name}">Назва події</td>
                    <td th:text="${ticket.event.eventDate}">2026-12-01</td>
                    <td class="fw-bold" th:text="'№ ' + ${ticket.number}">№ 1</td>
                    <td th:text="${ticket.cost} + ' грн'">500 грн</td>
                    <td><span class="badge bg-success" th:text="${ticket.status}">FREE</span></td>
                    <td>
                        <form sec:authorize="isAuthenticated()" th:action="@{/tickets/buy}" method="post">
                            <input type="hidden" name="ticketId" th:value="${ticket.id}">
                            <input type="hidden" name="redirectUrl"
                                   th:value="${eventId != null} ? '/tickets/event/' + ${eventId} : '/tickets/search?eventName=' + ${searchQuery}">
                            <button type="submit" class="btn btn-sm btn-primary">Купити квиток</button>
                        </form>
                        <span sec:authorize="isAnonymous()" class="text-muted small">Потрібен вхід</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
