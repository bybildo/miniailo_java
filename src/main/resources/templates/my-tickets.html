<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мої квитки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Мої придбані квитки (<span th:text="${customer.name}"></span>)</h3>
        <a th:href="@{/events}" class="btn btn-outline-secondary btn-sm">До подій</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Подія</th>
                    <th>Дата</th>
                    <th>Місце проведення</th>
                    <th>Місце №</th>
                    <th>Ціна</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(customer.tickets)}">
                    <td colspan="5" class="text-center py-4 text-muted">У вас ще немає куплених квитків.</td>
                </tr>
                <tr th:each="t : ${customer.tickets}">
                    <td class="fw-bold" th:text="${t.event.name}"></td>
                    <td th:text="${t.event.eventDate}"></td>
                    <td th:text="${t.event.place.name} + ' (' + ${t.event.place.address} + ')'"></td>
                    <td th:text="'№ ' + ${t.number}"></td>
                    <td th:text="${t.cost} + ' грн'"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
